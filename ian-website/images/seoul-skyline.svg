<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Seoul skyline illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c9a8"/>
      <stop offset="0.55" stop-color="#f3dcc6"/>
      <stop offset="1" stop-color="#f7f4ee"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6aa6"/>
      <stop offset="1" stop-color="#1f4e8c"/>
    </linearGradient>
  </defs>

  <!-- Sky and sun -->
  <rect width="900" height="380" fill="url(#sky)"/>
  <circle cx="700" cy="110" r="46" fill="#c8352e" opacity="0.85"/>

  <!-- Distant mountains -->
  <path d="M0 230 L120 160 L210 205 L330 130 L450 200 L560 150 L690 210 L800 165 L900 200 L900 290 L0 290 Z" fill="#b9a99a" opacity="0.6"/>

  <!-- Namsan hill with N Seoul Tower -->
  <path d="M180 290 Q300 185 420 290 Z" fill="#6f8f6a"/>
  <rect x="296" y="120" width="8" height="95" fill="#1d2433"/>
  <rect x="286" y="150" width="28" height="14" rx="3" fill="#1d2433"/>
  <rect x="290" y="166" width="20" height="8" rx="2" fill="#1d2433"/>
  <rect x="299" y="92" width="2" height="30" fill="#1d2433"/>

  <!-- City buildings -->
  <g fill="#1d2433">
    <rect x="20" y="235" width="40" height="55"/>
    <rect x="65" y="215" width="32" height="75"/>
    <rect x="102" y="245" width="46" height="45"/>
    <rect x="430" y="200" width="36" height="90"/>
    <rect x="470" y="170" width="30" height="120"/>
    <rect x="505" y="225" width="44" height="65"/>
    <rect x="555" y="190" width="28" height="100"/>
    <rect x="588" y="150" width="34" height="140"/>
    <rect x="628" y="215" width="40" height="75"/>
    <rect x="672" y="180" width="30" height="110"/>
    <rect x="707" y="230" width="48" height="60"/>
    <rect x="760" y="200" width="34" height="90"/>
    <rect x="800" y="240" width="44" height="50"/>
    <rect x="848" y="215" width="40" height="75"/>
  </g>

  <!-- Windows -->
  <g fill="#f6c9a8" opacity="0.8">
    <rect x="596" y="165" width="6" height="8"/><rect x="608" y="165" width="6" height="8"/>
    <rect x="596" y="185" width="6" height="8"/><rect x="608" y="185" width="6" height="8"/>
    <rect x="596" y="205" width="6" height="8"/><rect x="608" y="225" width="6" height="8"/>
    <rect x="478" y="185" width="5" height="7"/><rect x="489" y="205" width="5" height="7"/>
    <rect x="679" y="195" width="5" height="7"/><rect x="690" y="215" width="5" height="7"/>
  </g>

  <!-- Han River and bridge -->
  <rect x="0" y="290" width="900" height="90" fill="url(#river)"/>
  <rect x="0" y="300" width="900" height="6" fill="#d9dde5"/>
  <g fill="#d9dde5">
    <rect x="80" y="306" width="6" height="40"/>
    <rect x="260" y="306" width="6" height="40"/>
    <rect x="440" y="306" width="6" height="40"/>
    <rect x="620" y="306" width="6" height="40"/>
    <rect x="800" y="306" width="6" height="40"/>
  </g>
  <g stroke="#f7f4ee" stroke-width="2" opacity="0.35">
    <line x1="120" y1="360" x2="200" y2="360"/>
    <line x1="480" y1="368" x2="580" y2="368"/>
    <line x1="700" y1="355" x2="760" y2="355"/>
  </g>
</svg>
